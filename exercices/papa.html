<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Exos · Papa">
<title>Exercices · suivi Papa</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--mut:#5d6678;--line:#e3e6ec;--ok:#1f8a4c;--mid:#c98a00;--ko:#c63d3d;--acc:#3557d6}
  *{box-sizing:border-box}
  body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 40px}
  header{position:sticky;top:0;background:var(--bg);padding:14px 16px 10px;z-index:2;border-bottom:1px solid var(--line)}
  h1{font-size:1.25em;margin:0 0 10px}
  .tabs{display:flex;gap:8px}
  .tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:600;color:var(--mut)}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:14px 16px;max-width:760px;margin:0 auto}
  .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .tile .k{font-size:.8em;color:var(--mut)} .tile .v{font-size:1.35em;font-weight:700}
  .tile .s{font-size:.85em;color:var(--mut)}
  .day{font-size:.85em;font-weight:700;color:var(--mut);text-transform:capitalize;margin:18px 2px 8px}
  .g{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:10px}
  .who{font-size:1.3em}
  .t{font-weight:650;flex:1;min-width:0}
  .t small{display:block;font-weight:400;color:var(--mut)}
  .sc{font-weight:800;font-size:1.1em;white-space:nowrap}
  .sc.ok{color:var(--ok)} .sc.mid{color:var(--mid)} .sc.ko{color:var(--ko)}
  .meta{font-size:.85em;color:var(--mut);margin-top:6px}
  .tag{display:inline-block;font-size:.75em;font-weight:700;padding:1px 7px;border-radius:99px;background:#fde8e8;color:var(--ko);margin-left:6px;vertical-align:1px}
  details{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
  summary{cursor:pointer;color:var(--acc);font-size:.9em;font-weight:600}
  ul.err{margin:8px 0 0;padding:0;list-style:none}
  ul.err li{padding:7px 0;border-bottom:1px solid var(--line);font-size:.92em}
  ul.err li:last-child{border:0}
  .q{color:var(--mut)} .a{font-weight:650} .ess{font-size:.8em;color:var(--mut)}
  .empty,.msg{text-align:center;color:var(--mut);padding:30px 10px}
  form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;margin:30px auto}
  input{width:100%;font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;margin:8px 0 12px}
  .btn{font:inherit;font-weight:700;padding:10px 16px;border-radius:10px;border:0;background:var(--ink);color:#fff}
  .foot{text-align:center;margin-top:20px}
  .link{background:none;border:0;color:var(--acc);font:inherit;font-size:.9em}
</style>
</head>
<body>
<header>
  <h1>Suivi des exercices</h1>
  <div class="tabs" id="tabs">
    <button data-k="" class="on">Les deux</button>
    <button data-k="victor">🚀 Victor</button>
    <button data-k="louis">🚄 Louis</button>
  </div>
</header>
<main id="main"><p class="msg">Chargement…</p></main>
<script>
const API="https://exercices.bruno-b49.workers.dev/resultats";
const KIDS={victor:{n:"Victor",e:"🚀"},louis:{n:"Louis",e:"🚄"}};
const main=document.getElementById("main");
let filt="", rows=[];

function getKey(){
  const m=location.hash.match(/k=([^&]+)/);
  if(m){try{localStorage.setItem("papa_key",decodeURIComponent(m[1]))}catch(e){} history.replaceState(null,"",location.pathname);}
  try{return localStorage.getItem("papa_key")}catch(e){return null}
}
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const when=s=>new Date(s.replace(" ","T")+"Z");
const dur=s=>s==null?"":s<60?s+" s":Math.floor(s/60)+" min "+String(s%60).padStart(2,"0");
const pct=r=>r.total?Math.round(r.score/r.total*100):0;
const cls=p=>p>=80?"ok":p>=55?"mid":"ko";

function askKey(err){
  main.innerHTML=`<form id="f"><b>Clé d'accès</b>${err?`<p style="color:var(--ko)">${err}</p>`:""}
    <input id="k" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Colle la clé ici">
    <button class="btn">Ouvrir</button></form>`;
  document.getElementById("f").onsubmit=e=>{e.preventDefault();try{localStorage.setItem("papa_key",document.getElementById("k").value.trim())}catch(x){}load();};
}

function load(){
  const key=getKey(); if(!key) return askKey();
  main.innerHTML=`<p class="msg">Chargement…</p>`;
  fetch(API+"?limite=300",{headers:{Authorization:"Bearer "+key},cache:"no-store"})
    .then(r=>{if(r.status===401){try{localStorage.removeItem("papa_key")}catch(e){} throw "Clé incorrecte.";} if(!r.ok) throw "Erreur "+r.status; return r.json();})
    .then(d=>{rows=d;render();})
    .catch(e=>typeof e==="string"&&e.startsWith("Clé")?askKey(e):main.innerHTML=`<p class="msg">Impossible de charger les résultats (${esc(e)}).<br><button class="link" onclick="load()">Réessayer</button></p>`);
}

function summary(list){
  const kids=filt?[filt]:["victor","louis"], since=Date.now()-7*864e5;
  return `<div class="sum">${kids.map(k=>{
    const w=list.filter(r=>r.enfant===k&&when(r.recu_le)>=since);
    const fin=w.filter(r=>r.termine);
    const moy=fin.length?Math.round(fin.reduce((a,r)=>a+pct(r),0)/fin.length):null;
    const t=w.reduce((a,r)=>a+(r.duree_s||0),0);
    return `<div class="tile"><div class="k">${KIDS[k].e} ${KIDS[k].n} · 7 derniers jours</div>
      <div class="v">${w.length} partie${w.length>1?"s":""}</div>
      <div class="s">${moy===null?"—":"Moyenne "+moy+" %"} · ${dur(t)||"0 s"}${w.length-fin.length?` · ${w.length-fin.length} abandon${w.length-fin.length>1?"s":""}`:""}</div></div>`;
  }).join("")}</div>`;
}

function render(){
  const list=rows.filter(r=>!filt||r.enfant===filt);
  let h=summary(rows.filter(r=>!filt||r.enfant===filt));
  if(!list.length){ main.innerHTML=h+`<p class="empty">Aucune partie pour l'instant.</p>`+foot(); return; }
  let last="";
  list.forEach(r=>{
    const d=when(r.recu_le), day=d.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
    if(day!==last){h+=`<div class="day">${day}</div>`;last=day;}
    const p=pct(r); let errs=[]; try{errs=JSON.parse(r.erreurs||"[]")}catch(e){}
    const byQ={}; errs.forEach(e=>{(byQ[e.n]=byQ[e.n]||{q:e.question,part:e.partie,a:[]}).a[e.essai]=e.reponse;});
    const qs=Object.keys(byQ).sort((a,b)=>a-b);
    h+=`<div class="g"><div class="row"><span class="who" aria-hidden="true">${KIDS[r.enfant]?.e||""}</span>
      <div class="t">${esc(r.exercice_titre||r.exercice_id)}${r.termine?"":`<span class="tag">abandonné</span>`}
      <small>${KIDS[r.enfant]?.n||r.enfant} · ${d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}</small></div>
      <div class="sc ${cls(p)}">${r.score} / ${r.total}<br><small style="font-weight:600">${p} %</small></div></div>
      <div class="meta">⏱ ${dur(r.duree_s)} · 💡 ${r.indices} indice${r.indices>1?"s":""} · 🆘 ${r.reponses_donnees} réponse${r.reponses_donnees>1?"s":""} donnée${r.reponses_donnees>1?"s":""}</div>
      ${qs.length?`<details><summary>${qs.length} question${qs.length>1?"s":""} avec erreur</summary><ul class="err">${qs.map(n=>{const x=byQ[n];
        return `<li><span class="ess">Q${n}${x.part?" · "+esc(x.part):""}</span><br><span class="q">${esc(x.q)}</span><br>
        1er essai : <span class="a">${esc(x.a[1]||"—")}</span>${x.a[2]!==undefined?` · 2e essai : <span class="a">${esc(x.a[2]||"—")}</span>`:` · <span style="color:var(--ok)">réussi au 2e essai</span>`}</li>`;}).join("")}</ul></details>`:""}
    </div>`;
  });
  main.innerHTML=h+foot();
}
const foot=()=>`<p class="foot"><button class="link" onclick="load()">↻ Actualiser</button></p>`;

document.getElementById("tabs").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; filt=b.dataset.k;
  document.querySelectorAll("#tabs button").forEach(x=>x.classList.toggle("on",x===b)); if(rows.length) render();
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&rows.length) load()});
load();
</script>
</body>
</html>
