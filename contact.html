<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact – Applications de Bruno Latour</title>
  <meta name="description" content="Une question sur MKTS, Cave à vin ou Bien manger avec Nicole ? Un code d’invitation pour la bêta de Cave à vin ? Écrivez-moi.">
  <link rel="canonical" href="https://blatourdev.github.io/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Applications de Bruno Latour">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:url" content="https://blatourdev.github.io/contact.html">
  <meta property="og:title" content="Contact – Applications de Bruno Latour">
  <meta property="og:description" content="Une question sur MKTS, Cave à vin ou Bien manger avec Nicole ? Un code d’invitation pour la bêta de Cave à vin ? Écrivez-moi.">
  <meta property="og:image" content="https://blatourdev.github.io/img/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0c0e12">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/png" href="img/mkts-icon.png">
  <link rel="stylesheet" href="style.css?v=2">
</head>
<body class="contact-page">
  <nav class="topbar">
    <div class="wrap">
      <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>Toutes mes applications</a>
    </div>
  </nav>

  <main class="wrap contact">
    <header>
      <p class="eyebrow">Contact</p>
      <h1>Écrivez-moi</h1>
      <p class="lead">Une question, une idée, un bug, ou un code d’invitation pour la bêta de Cave à vin : je vous réponds par e-mail.</p>
    </header>

    <form id="contact-form" class="contact-form" novalidate>
      <div class="row">
        <label>Votre nom
          <input name="name" autocomplete="name" required maxlength="100">
        </label>
        <label>Votre e-mail
          <input name="email" type="email" autocomplete="email" required maxlength="200">
        </label>
      </div>
      <div class="row">
        <label>Objet
          <select name="subject">
            <option value="question">Une question sur une application</option>
            <option value="code-cave">Code d’invitation (Cave à vin)</option>
            <option value="bug">Signaler un bug</option>
            <option value="autre">Autre</option>
          </select>
        </label>
        <label>Application
          <select name="app">
            <option value="">—</option>
            <option value="mkts">MKTS</option>
            <option value="nicole">Bien manger avec Nicole</option>
            <option value="cave">Cave à vin</option>
          </select>
        </label>
      </div>
      <label>Message
        <textarea name="message" rows="7" required maxlength="5000"></textarea>
      </label>
      <!-- Champ piège pour les robots : caché aux humains -->
      <label class="trap" aria-hidden="true">Site web <input name="website" tabindex="-1" autocomplete="off"></label>
      <p class="hint">Votre adresse sert uniquement à vous répondre.</p>
      <button class="btn btn-send" type="submit">Envoyer</button>
      <p class="form-status" role="status" aria-live="polite"></p>
    </form>
  </main>

  <footer>
    <div class="wrap">
      <span>© 2026 Bruno Latour</span>
      <span class="foot-links"><a href="./">Toutes mes applications</a><a href="https://buymeacoffee.com/blatourdev" target="_blank" rel="noopener">☕ Offrez-moi un café</a></span>
    </div>
  </footer>

  <script>
    const ENDPOINT = "https://contact-blatourdev.bruno-b49.workers.dev/";
    const form = document.getElementById("contact-form");
    const status = form.querySelector(".form-status");
    const button = form.querySelector("button");

    // Pré-remplissage depuis le lien : contact.html?objet=code-cave&app=cave
    const q = new URLSearchParams(location.search);
    if (q.get("objet")) form.subject.value = q.get("objet");
    if (q.get("app")) form.app.value = q.get("app");
    if (form.subject.value === "code-cave" && !form.app.value) form.app.value = "cave";
    if (form.subject.value === "code-cave" && !form.message.value)
      form.message.value = "Bonjour, je souhaiterais un code d’invitation pour essayer les fonctions d’IA de Cave à vin.";

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!form.checkValidity()) { status.className = "form-status err"; status.textContent = "Merci de remplir votre nom, une adresse e-mail valide et votre message."; return; }
      button.disabled = true; button.textContent = "Envoi…";
      status.className = "form-status"; status.textContent = "";
      try {
        const res = await fetch(ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form))),
        });
        const out = await res.json().catch(() => ({}));
        if (!res.ok || !out.ok) throw new Error(out.error || "L’envoi a échoué.");
        form.reset();
        status.className = "form-status ok";
        status.textContent = "Merci, votre message est bien parti. Je vous réponds dès que possible.";
      } catch (err) {
        status.className = "form-status err";
        status.textContent = (err.message && !err.message.startsWith("Failed") ? err.message : "L’envoi a échoué.") + " Réessayez dans un moment.";
      } finally {
        button.disabled = false; button.textContent = "Envoyer";
      }
    });
  </script>
</body>
</html>
